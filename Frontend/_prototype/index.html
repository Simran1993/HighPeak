<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HighPeak · Demo</title>
    <!--
      Single-file, zero-build demo for poking at the HighPeak backend.
      React 18 + htm loaded as native ES modules from a CDN, Tailwind via CDN.
      No npm, no bundler. Served (and /api proxied) by server.mjs.
      Throwaway: the real stack is specced in ../FRONTEND.md.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div id="root" class="min-h-screen"></div>

    <script type="module">
      import React, { useState, useEffect, useCallback } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import htm from 'https://esm.sh/htm@3.1.1';

      const html = htm.bind(React.createElement);
      const API = '/api/v1';

      /* ----------------------------- API layer ----------------------------- */
      class ApiError extends Error {
        constructor(status, data) {
          super(data?.message || `Request failed (${status})`);
          this.status = status;
          this.data = data;
        }
      }

      const tokens = {
        get access() { return localStorage.getItem('hp_access'); },
        get refresh() { return localStorage.getItem('hp_refresh'); },
        set({ accessToken, refreshToken }) {
          localStorage.setItem('hp_access', accessToken);
          localStorage.setItem('hp_refresh', refreshToken);
        },
        clear() {
          localStorage.removeItem('hp_access');
          localStorage.removeItem('hp_refresh');
        },
      };

      // The JWT 'sub' claim is the current user's id — used to align own chat messages.
      function currentUserId() {
        try {
          const part = tokens.access?.split('.')[1];
          if (!part) return null;
          const json = atob(part.replace(/-/g, '+').replace(/_/g, '/').padEnd(part.length + ((4 - (part.length % 4)) % 4), '='));
          return JSON.parse(json).sub || null;
        } catch { return null; }
      }

      async function raw(path, { method = 'GET', body, auth = true } = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (auth && tokens.access) headers.Authorization = `Bearer ${tokens.access}`;
        const res = await fetch(API + path, {
          method,
          headers,
          body: body !== undefined ? JSON.stringify(body) : undefined,
        });
        if (res.status === 204) return null;
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new ApiError(res.status, data);
        return data;
      }

      // Wraps raw() with a single auto-refresh attempt on 401.
      async function api(path, opts = {}) {
        try {
          return await raw(path, opts);
        } catch (err) {
          if (err.status === 401 && tokens.refresh && opts.auth !== false) {
            try {
              const fresh = await raw('/auth/refresh', {
                method: 'POST',
                auth: false,
                body: { refreshToken: tokens.refresh },
              });
              tokens.set(fresh);
              return await raw(path, opts); // retry once
            } catch {
              tokens.clear();
              window.dispatchEvent(new Event('hp-logout'));
            }
          }
          throw err;
        }
      }

      /* ----------------------------- helpers ------------------------------- */
      const CATEGORIES = ['TRANSPORT', 'ACCOMMODATION', 'FOOD', 'SIGHTSEEING', 'ACTIVITY', 'SHOPPING', 'OTHER'];
      const CATEGORY_STYLE = {
        TRANSPORT: 'bg-sky-100 text-sky-700',
        ACCOMMODATION: 'bg-violet-100 text-violet-700',
        FOOD: 'bg-amber-100 text-amber-700',
        SIGHTSEEING: 'bg-emerald-100 text-emerald-700',
        ACTIVITY: 'bg-rose-100 text-rose-700',
        SHOPPING: 'bg-fuchsia-100 text-fuchsia-700',
        OTHER: 'bg-slate-200 text-slate-600',
      };
      const ROLE_STYLE = {
        OWNER: 'bg-indigo-600 text-white',
        EDITOR: 'bg-indigo-100 text-indigo-700',
        VIEWER: 'bg-slate-200 text-slate-600',
      };
      const canEdit = (role) => role === 'OWNER' || role === 'EDITOR';
      const fmtDate = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—');
      const fmtMoney = (c) => (c == null ? '' : new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }).format(c));

      // Maps deep-linking: open the native maps app for a location string.
      // Apple devices → Apple Maps; everything else → Google Maps. Both URLs hand
      // off to the installed app and fall back to the web map if there isn't one.
      const isApple = /iPhone|iPad|iPod|Macintosh|Mac OS X/.test(navigator.userAgent);
      const mapsProvider = isApple ? 'Apple Maps' : 'Google Maps';
      const mapsUrl = (query) => {
        const q = encodeURIComponent(query);
        return isApple ? `https://maps.apple.com/?q=${q}` : `https://www.google.com/maps/search/?api=1&query=${q}`;
      };
      // A 📍 location that links to the native map. `extra` is appended after the link (e.g. cost).
      function MapLink({ query, label, extra = '', className = 'text-slate-400' }) {
        if (!query) return html`<span class=${className}>📍 ${label || '—'}${extra}</span>`;
        return html`<span class=${className}>📍 <a
          href=${mapsUrl(query)} target="_blank" rel="noreferrer"
          class="underline-offset-2 hover:text-indigo-500 hover:underline"
          title=${`Open "${query}" in ${mapsProvider}`}
        >${label || query}</a>${extra}</span>`;
      }

      /* ----------------------------- UI atoms ------------------------------ */
      function Button({ variant = 'primary', className = '', ...props }) {
        const base = 'inline-flex items-center justify-center gap-1.5 rounded-lg px-3.5 py-2 text-sm font-medium transition disabled:opacity-50 disabled:pointer-events-none';
        const variants = {
          primary: 'bg-indigo-600 text-white hover:bg-indigo-500 shadow-sm',
          ghost: 'text-slate-600 hover:bg-slate-100',
          subtle: 'bg-slate-100 text-slate-700 hover:bg-slate-200',
          danger: 'bg-rose-50 text-rose-600 hover:bg-rose-100',
        };
        return html`<button class=${`${base} ${variants[variant]} ${className}`} ...${props} />`;
      }

      function Field({ label, ...props }) {
        return html`
          <label class="block">
            <span class="mb-1 block text-xs font-medium text-slate-500">${label}</span>
            <input
              class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"
              ...${props}
            />
          </label>`;
      }

      function Badge({ className = '', children }) {
        return html`<span class=${`inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-semibold uppercase tracking-wide ${className}`}>${children}</span>`;
      }

      function Toast({ toast, onClose }) {
        if (!toast) return null;
        const tone = toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600';
        return html`
          <div class="fixed bottom-6 right-6 z-50 max-w-sm">
            <div class=${`flex items-start gap-3 rounded-xl ${tone} px-4 py-3 text-sm text-white shadow-lg`}>
              <span class="flex-1">${toast.message}</span>
              <button class="opacity-80 hover:opacity-100" onClick=${onClose}>✕</button>
            </div>
          </div>`;
      }

      function Spinner({ label = 'Loading…' }) {
        return html`<div class="flex items-center gap-2 py-8 text-sm text-slate-400">
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-slate-300 border-t-indigo-500"></span>${label}
        </div>`;
      }

      function Modal({ title, onClose, children }) {
        return html`
          <div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4" onClick=${onClose}>
            <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl" onClick=${(e) => e.stopPropagation()}>
              <div class="mb-4 flex items-center justify-between">
                <h3 class="text-lg font-semibold">${title}</h3>
                <button class="text-slate-400 hover:text-slate-600" onClick=${onClose}>✕</button>
              </div>
              ${children}
            </div>
          </div>`;
      }

      /* ---------------------------- Auth screen ---------------------------- */
      function AuthScreen({ onAuthed, toast }) {
        const [mode, setMode] = useState('login');
        const [form, setForm] = useState({ name: '', email: '', password: '' });
        const [busy, setBusy] = useState(false);
        const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

        const submit = async (e) => {
          e.preventDefault();
          setBusy(true);
          try {
            const path = mode === 'login' ? '/auth/login' : '/auth/register';
            const body = mode === 'login'
              ? { email: form.email, password: form.password }
              : form;
            const res = await api(path, { method: 'POST', auth: false, body });
            tokens.set(res);
            onAuthed();
          } catch (err) {
            toast('error', err.message);
          } finally {
            setBusy(false);
          }
        };

        return html`
          <div class="flex min-h-screen items-center justify-center p-4">
            <div class="w-full max-w-sm">
              <div class="mb-6 text-center">
                <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-600 text-2xl">🏔️</div>
                <h1 class="text-2xl font-bold tracking-tight">HighPeak</h1>
                <p class="text-sm text-slate-500">Collaborative trip planning · demo</p>
              </div>
              <div class="rounded-2xl bg-white p-6 shadow-sm">
                <div class="mb-5 grid grid-cols-2 gap-1 rounded-lg bg-slate-100 p-1 text-sm font-medium">
                  ${['login', 'register'].map((m) => html`
                    <button
                      key=${m}
                      class=${`rounded-md py-1.5 capitalize transition ${mode === m ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}
                      onClick=${() => setMode(m)}
                    >${m}</button>`)}
                </div>
                <form class="space-y-3" onSubmit=${submit}>
                  ${mode === 'register' && html`<${Field} label="Name" value=${form.name} onInput=${set('name')} required maxLength=${100} placeholder="Jane Traveler" />`}
                  <${Field} label="Email" type="email" value=${form.email} onInput=${set('email')} required placeholder="you@example.com" />
                  <${Field} label="Password" type="password" value=${form.password} onInput=${set('password')} required minLength=${8} placeholder="Min. 8 characters" />
                  <${Button} type="submit" className="w-full" disabled=${busy}>
                    ${busy ? 'Please wait…' : mode === 'login' ? 'Log in' : 'Create account'}
                  <//>
                </form>
                <a
                  class="mt-3 flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50"
                  href=${`${API}/oauth2/authorization/google`}
                >Continue with Google</a>
              </div>
              <p class="mt-4 text-center text-xs text-slate-400">Talks to the backend at <code>localhost:8080</code> via proxy.</p>
            </div>
          </div>`;
      }

      /* --------------------------- Trip sidebar ---------------------------- */
      function Sidebar({ trips, loading, selectedId, onSelect, onNew, onReload }) {
        return html`
          <aside class="flex w-72 shrink-0 flex-col border-r border-slate-200 bg-white">
            <div class="flex items-center justify-between px-4 py-3">
              <h2 class="text-sm font-semibold text-slate-500">Your trips</h2>
              <button class="text-slate-400 hover:text-indigo-600" title="Refresh" onClick=${onReload}>↻</button>
            </div>
            <div class="px-3">
              <${Button} className="w-full" onClick=${onNew}>+ New trip<//>
            </div>
            <div class="mt-3 flex-1 overflow-y-auto px-3 pb-4">
              ${loading
                ? html`<${Spinner} />`
                : trips.length === 0
                ? html`<p class="px-2 py-8 text-center text-sm text-slate-400">No trips yet.<br/>Create your first one.</p>`
                : trips.map((t) => html`
                    <button
                      key=${t.id}
                      onClick=${() => onSelect(t.id)}
                      class=${`mb-1.5 block w-full rounded-xl border px-3 py-2.5 text-left transition ${selectedId === t.id ? 'border-indigo-200 bg-indigo-50' : 'border-transparent hover:bg-slate-50'}`}
                    >
                      <div class="flex items-center justify-between gap-2">
                        <span class="truncate text-sm font-semibold">${t.title}</span>
                        <${Badge} className=${ROLE_STYLE[t.myRole]}>${t.myRole}<//>
                      </div>
                      <div class="mt-0.5 truncate text-xs text-slate-400">${t.destination || 'No destination'} · ${fmtDate(t.startDate)}</div>
                    </button>`)}
            </div>
          </aside>`;
      }

      /* --------------------------- Trip detail ----------------------------- */
      function TripDetail({ tripId, onChanged, onDeleted, toast }) {
        const [trip, setTrip] = useState(null);
        const [tab, setTab] = useState('overview');
        const [loading, setLoading] = useState(true);

        const load = useCallback(async () => {
          setLoading(true);
          try {
            setTrip(await api(`/trips/${tripId}`));
          } catch (err) {
            toast('error', err.message);
          } finally {
            setLoading(false);
          }
        }, [tripId]);

        useEffect(() => { setTab('overview'); load(); }, [tripId]);

        if (loading) return html`<div class="p-8"><${Spinner} label="Loading trip…" /></div>`;
        if (!trip) return html`<div class="p-8 text-slate-400">Trip not found.</div>`;

        const editable = canEdit(trip.myRole);
        const tabs = ['overview', 'itinerary', 'members', 'discussion'];

        return html`
          <div class="flex h-full flex-col">
            <header class="border-b border-slate-200 bg-white px-8 pt-6">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold tracking-tight">${trip.title}</h1>
                    <${Badge} className=${trip.status === 'PUBLISHED' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-500'}>${trip.status}<//>
                    <${Badge} className=${ROLE_STYLE[trip.myRole]}>${trip.myRole}<//>
                  </div>
                  <p class="mt-1 text-sm text-slate-500">
                    <${MapLink} query=${trip.destination} label=${trip.destination || 'No destination'} className="text-slate-500" />
                    <span class="mx-2 text-slate-300">|</span>
                    🗓️ ${fmtDate(trip.startDate)} – ${fmtDate(trip.endDate)}
                    <span class="mx-2 text-slate-300">|</span>
                    👥 ${trip.memberCount}
                  </p>
                  ${trip.description && html`<p class="mt-2 max-w-2xl text-sm text-slate-600">${trip.description}</p>`}
                </div>
              </div>
              <nav class="mt-5 flex gap-1">
                ${tabs.map((t) => html`
                  <button
                    key=${t}
                    onClick=${() => setTab(t)}
                    class=${`rounded-t-lg px-4 py-2 text-sm font-medium capitalize transition ${tab === t ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                  >${t}</button>`)}
              </nav>
            </header>
            <div class="flex-1 overflow-y-auto p-8">
              ${tab === 'overview' && html`<${OverviewTab} trip=${trip} editable=${editable} onChanged=${() => { load(); onChanged(); }} onDeleted=${onDeleted} toast=${toast} />`}
              ${tab === 'itinerary' && html`<${ItineraryTab} trip=${trip} editable=${editable} toast=${toast} />`}
              ${tab === 'members' && html`<${MembersTab} trip=${trip} editable=${editable} onChanged=${() => { load(); onChanged(); }} onDeleted=${onDeleted} toast=${toast} />`}
              ${tab === 'discussion' && html`<${DiscussionTab} trip=${trip} toast=${toast} />`}
            </div>
          </div>`;
      }

      function OverviewTab({ trip, editable, onChanged, onDeleted, toast }) {
        const [editing, setEditing] = useState(false);
        const [form, setForm] = useState(trip);
        const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

        const save = async (e) => {
          e.preventDefault();
          try {
            await api(`/trips/${trip.id}`, {
              method: 'PATCH',
              body: {
                title: form.title,
                description: form.description,
                destination: form.destination,
                startDate: form.startDate || null,
                endDate: form.endDate || null,
              },
            });
            setEditing(false);
            toast('ok', 'Trip updated');
            onChanged();
          } catch (err) { toast('error', err.message); }
        };

        const remove = async () => {
          if (!confirm('Permanently delete this trip and all its data?')) return;
          try {
            await api(`/trips/${trip.id}`, { method: 'DELETE' });
            toast('ok', 'Trip deleted');
            onDeleted();
          } catch (err) { toast('error', err.message); }
        };

        if (editing) {
          return html`
            <form class="max-w-lg space-y-3 rounded-2xl bg-white p-6 shadow-sm" onSubmit=${save}>
              <h3 class="mb-2 font-semibold">Edit trip</h3>
              <${Field} label="Title" value=${form.title || ''} onInput=${set('title')} required maxLength=${255} />
              <${Field} label="Destination" value=${form.destination || ''} onInput=${set('destination')} />
              <label class="block">
                <span class="mb-1 block text-xs font-medium text-slate-500">Description</span>
                <textarea class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100" rows=${3} value=${form.description || ''} onInput=${set('description')}></textarea>
              </label>
              <div class="grid grid-cols-2 gap-3">
                <${Field} label="Start date" type="date" value=${form.startDate || ''} onInput=${set('startDate')} />
                <${Field} label="End date" type="date" value=${form.endDate || ''} onInput=${set('endDate')} />
              </div>
              <div class="flex gap-2 pt-2">
                <${Button} type="submit">Save changes<//>
                <${Button} type="button" variant="ghost" onClick=${() => { setForm(trip); setEditing(false); }}>Cancel<//>
              </div>
            </form>`;
        }

        return html`
          <div class="max-w-lg space-y-4">
            <dl class="grid grid-cols-2 gap-4 rounded-2xl bg-white p-6 shadow-sm">
              ${[['Destination', trip.destination || '—'], ['Status', trip.status], ['Start', fmtDate(trip.startDate)], ['End', fmtDate(trip.endDate)], ['Members', trip.memberCount], ['Your role', trip.myRole]].map(([k, v]) => html`
                <div key=${k}><dt class="text-xs uppercase tracking-wide text-slate-400">${k}</dt><dd class="mt-0.5 text-sm font-medium">${v}</dd></div>`)}
            </dl>
            ${(editable || trip.myRole === 'OWNER') && html`
              <div class="flex gap-2">
                ${editable && html`<${Button} variant="subtle" onClick=${() => { setForm(trip); setEditing(true); }}>Edit trip<//>`}
                ${trip.myRole === 'OWNER' && html`<${Button} variant="danger" onClick=${remove}>Delete trip<//>`}
              </div>`}
          </div>`;
      }

      // Members tab — current members plus (for OWNER/EDITOR) the invite controls
      // and pending invites, all in one place.
      function MembersTab({ trip, editable, onChanged, onDeleted, toast }) {
        const [members, setMembers] = useState(null);
        const [invites, setInvites] = useState(null);
        const [email, setEmail] = useState('');

        const load = useCallback(async () => {
          try { setMembers(await api(`/trips/${trip.id}/members`)); }
          catch (err) { toast('error', err.message); }
          if (editable) {
            try { setInvites(await api(`/trips/${trip.id}/invites`)); }
            catch (err) { toast('error', err.message); setInvites([]); }
          } else {
            setInvites([]);
          }
        }, [trip.id, editable]);
        useEffect(() => { load(); }, [trip.id, editable]);

        const removeMember = async (m) => {
          if (!confirm(`Remove ${m.name} from this trip?`)) return;
          try { await api(`/trips/${trip.id}/members/${m.userId}`, { method: 'DELETE' }); toast('ok', 'Member removed'); load(); onChanged(); }
          catch (err) { toast('error', err.message); }
        };
        const leave = async () => {
          if (!confirm('Leave this trip?')) return;
          try { await api(`/trips/${trip.id}/members/me`, { method: 'DELETE' }); toast('ok', 'You left the trip'); onDeleted(); }
          catch (err) { toast('error', err.message); }
        };
        const sendInvite = async (e) => {
          e.preventDefault();
          try { await api(`/trips/${trip.id}/invites`, { method: 'POST', body: { email } }); setEmail(''); toast('ok', `Invite sent to ${email}`); load(); }
          catch (err) { toast('error', err.message); }
        };
        const revokeInvite = async (id) => {
          try { await api(`/trips/${trip.id}/invites/${id}`, { method: 'DELETE' }); toast('ok', 'Invite revoked'); load(); }
          catch (err) { toast('error', err.message); }
        };

        if (!members) return html`<${Spinner} />`;
        return html`
          <div class="max-w-2xl space-y-6">
            <section class="space-y-2">
              <h3 class="text-sm font-semibold text-slate-500">Members · ${members.length}</h3>
              ${members.map((m) => html`
                <div key=${m.userId} class="flex items-center gap-3 rounded-xl bg-white p-3 shadow-sm">
                  <div class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-600">${(m.name || '?')[0].toUpperCase()}</div>
                  <div class="flex-1">
                    <div class="text-sm font-medium">${m.name}</div>
                    <div class="text-xs text-slate-400">${m.email}</div>
                  </div>
                  <${Badge} className=${ROLE_STYLE[m.role]}>${m.role}<//>
                  ${trip.myRole === 'OWNER' && m.role !== 'OWNER' && html`<${Button} variant="danger" className="px-2 py-1" onClick=${() => removeMember(m)}>Remove<//>`}
                </div>`)}
              ${trip.myRole !== 'OWNER' && html`<div class="pt-1"><${Button} variant="danger" onClick=${leave}>Leave trip<//></div>`}
            </section>

            ${editable && html`
              <section class="space-y-2">
                <h3 class="text-sm font-semibold text-slate-500">Invite people</h3>
                <form class="flex items-end gap-2 rounded-2xl bg-white p-4 shadow-sm" onSubmit=${sendInvite}>
                  <div class="flex-1"><${Field} label="Invite by email" type="email" value=${email} onInput=${(e) => setEmail(e.target.value)} required placeholder="friend@example.com" /></div>
                  <${Button} type="submit">Send invite<//>
                </form>
                ${!invites ? html`<${Spinner} />` : invites.length === 0 ? html`<p class="text-sm text-slate-400">No pending invites.</p>` : html`
                  <div class="space-y-2">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Pending invites</p>
                    ${invites.map((inv) => html`
                      <div key=${inv.id} class="flex items-center gap-3 rounded-xl bg-white p-3 shadow-sm">
                        <div class="flex-1">
                          <div class="text-sm font-medium">${inv.invitedEmail}</div>
                          <div class="text-xs text-slate-400">Invited by ${inv.invitedByName} · expires ${new Date(inv.expiresAt).toLocaleDateString()}</div>
                        </div>
                        <${Badge} className="bg-amber-100 text-amber-700">${inv.status}<//>
                        <${Button} variant="danger" className="px-2 py-1" onClick=${() => revokeInvite(inv.id)}>Revoke<//>
                      </div>`)}
                  </div>`}
              </section>`}
          </div>`;
      }

      // Discussion tab — a simple group chat shared by all trip members.
      // Backed by GET/POST /trips/{id}/messages; polls every few seconds for new messages.
      function DiscussionTab({ trip, toast }) {
        const [messages, setMessages] = useState(null);
        const [text, setText] = useState('');
        const [sending, setSending] = useState(false);
        const meId = currentUserId();
        const bottomRef = React.useRef(null);

        const load = useCallback(async (showError) => {
          try { setMessages(await api(`/trips/${trip.id}/messages`)); }
          catch (err) { if (showError) toast('error', err.message); }
        }, [trip.id]);

        // Initial load + light polling so other members' messages show up.
        useEffect(() => {
          load(true);
          const timer = setInterval(() => load(false), 4000);
          return () => clearInterval(timer);
        }, [trip.id]);

        // Auto-scroll to the newest message.
        useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages?.length]);

        const send = async (e) => {
          e.preventDefault();
          const content = text.trim();
          if (!content) return;
          setSending(true);
          try {
            const msg = await api(`/trips/${trip.id}/messages`, { method: 'POST', body: { content } });
            setText('');
            setMessages((prev) => [...(prev || []), msg]);
          } catch (err) { toast('error', err.message); }
          finally { setSending(false); }
        };

        const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');

        return html`
          <div class="mx-auto flex h-full max-w-2xl flex-col">
            <div class="flex-1 space-y-3 overflow-y-auto pb-4">
              ${messages === null
                ? html`<${Spinner} label="Loading messages…" />`
                : messages.length === 0
                ? html`<div class="flex h-full flex-col items-center justify-center text-center text-slate-400"><div class="text-4xl">💬</div><p class="mt-2 text-sm">No messages yet. Start the discussion.</p></div>`
                : messages.map((m) => {
                    const mine = m.userId === meId;
                    return html`
                      <div key=${m.id} class=${`flex items-end gap-2 ${mine ? 'flex-row-reverse' : ''}`}>
                        <div class=${`flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold ${mine ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'}`}>
                          ${(m.authorName || '?')[0].toUpperCase()}
                        </div>
                        <div class=${`max-w-[75%] rounded-2xl px-3.5 py-2 ${mine ? 'rounded-br-sm bg-indigo-600 text-white' : 'rounded-bl-sm bg-white text-slate-800 shadow-sm'}`}>
                          ${!mine && html`<div class="mb-0.5 text-xs font-semibold text-indigo-500">${m.authorName}</div>`}
                          <div class="whitespace-pre-wrap break-words text-sm">${m.content}</div>
                          <div class=${`mt-0.5 text-right text-[10px] ${mine ? 'text-indigo-200' : 'text-slate-400'}`}>${fmtTime(m.createdAt)}</div>
                        </div>
                      </div>`;
                  })}
              <div ref=${bottomRef}></div>
            </div>
            <form class="flex items-center gap-2 border-t border-slate-200 bg-slate-50 pt-3" onSubmit=${send}>
              <input
                class="flex-1 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"
                placeholder="Message the group…"
                value=${text}
                maxLength=${2000}
                onInput=${(e) => setText(e.target.value)}
              />
              <${Button} type="submit" className="rounded-full" disabled=${sending || !text.trim()}>Send<//>
            </form>
          </div>`;
      }

      /* --------------------------- Itinerary ------------------------------- */
      function ItineraryTab({ trip, editable, toast }) {
        const [days, setDays] = useState(null);
        const [showAddDay, setShowAddDay] = useState(false);
        const load = useCallback(async () => {
          try { setDays(await api(`/trips/${trip.id}/itinerary`)); }
          catch (err) { toast('error', err.message); }
        }, [trip.id]);
        useEffect(() => { load(); }, [trip.id]);

        const deleteDay = async (dayId) => {
          if (!confirm('Delete this day and all its activities?')) return;
          try { await api(`/trips/${trip.id}/itinerary/days/${dayId}`, { method: 'DELETE' }); toast('ok', 'Day deleted'); load(); }
          catch (err) { toast('error', err.message); }
        };

        if (!days) return html`<${Spinner} />`;
        return html`
          <div class="space-y-4">
            ${editable && html`<${Button} variant="subtle" onClick=${() => setShowAddDay(true)}>+ Add day<//>`}
            ${days.length === 0 && html`<p class="text-sm text-slate-400">No days planned yet.</p>`}
            <div class="space-y-5">
              ${days.map((day) => html`<${DayCard} key=${day.id} trip=${trip} day=${day} editable=${editable} onReload=${load} onDelete=${() => deleteDay(day.id)} toast=${toast} />`)}
            </div>
            ${showAddDay && html`<${AddDayModal} tripId=${trip.id} onClose=${() => setShowAddDay(false)} onDone=${() => { setShowAddDay(false); load(); }} toast=${toast} />`}
          </div>`;
      }

      function DayCard({ trip, day, editable, onReload, onDelete, toast }) {
        const [adding, setAdding] = useState(false);
        const [editingActivity, setEditingActivity] = useState(null);
        const deleteActivity = async (a) => {
          if (!confirm('Delete this activity?')) return;
          try { await api(`/trips/${trip.id}/itinerary/days/${day.id}/activities/${a.id}`, { method: 'DELETE' }); toast('ok', 'Activity deleted'); onReload(); }
          catch (err) { toast('error', err.message); }
        };
        return html`
          <div class="rounded-2xl bg-white p-5 shadow-sm">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="font-semibold">${fmtDate(day.date)}</h3>
                ${day.notes && html`<p class="text-xs text-slate-400">${day.notes}</p>`}
              </div>
              ${editable && html`
                <div class="flex gap-1">
                  <${Button} variant="subtle" className="px-2 py-1" onClick=${() => setAdding(true)}>+ Activity<//>
                  <${Button} variant="ghost" className="px-2 py-1 text-slate-400" onClick=${onDelete}>🗑</button>
                <//>`}
            </div>
            <div class="mt-3 space-y-2">
              ${day.activities.length === 0 ? html`<p class="text-xs text-slate-300">No activities.</p>` : day.activities.map((a) => html`
                <div key=${a.id} class="flex items-start gap-3 rounded-lg border border-slate-100 p-3">
                  <div class="w-16 shrink-0 text-xs font-medium text-slate-400">${(a.startTime || '').slice(0, 5)}</div>
                  <div class="flex-1">
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-medium">${a.title}</span>
                      ${a.category && html`<${Badge} className=${CATEGORY_STYLE[a.category]}>${a.category}<//>`}
                    </div>
                    <div class="text-xs"><${MapLink} query=${a.location} extra=${a.cost != null ? ` · ${fmtMoney(a.cost)}` : ''} /></div>
                    ${a.notes && html`<div class="mt-0.5 text-xs text-slate-500">${a.notes}</div>`}
                    ${a.bookingLink && html`<a class="text-xs text-indigo-500 hover:underline" href=${a.bookingLink} target="_blank">Booking link ↗</a>`}
                  </div>
                  ${editable && html`
                    <div class="flex shrink-0 gap-1.5 text-slate-300">
                      <button class="hover:text-indigo-500" title="Edit activity" onClick=${() => setEditingActivity(a)}>✎</button>
                      <button class="hover:text-rose-500" title="Delete activity" onClick=${() => deleteActivity(a)}>✕</button>
                    </div>`}
                </div>`)}
            </div>
            ${adding && html`<${ActivityModal} tripId=${trip.id} dayId=${day.id} onClose=${() => setAdding(false)} onDone=${() => { setAdding(false); onReload(); }} toast=${toast} />`}
            ${editingActivity && html`<${ActivityModal} tripId=${trip.id} dayId=${day.id} activity=${editingActivity} onClose=${() => setEditingActivity(null)} onDone=${() => { setEditingActivity(null); onReload(); }} toast=${toast} />`}
          </div>`;
      }

      function AddDayModal({ tripId, onClose, onDone, toast }) {
        const [form, setForm] = useState({ date: '', notes: '' });
        const submit = async (e) => {
          e.preventDefault();
          try { await api(`/trips/${tripId}/itinerary/days`, { method: 'POST', body: { date: form.date, notes: form.notes || null } }); toast('ok', 'Day added'); onDone(); }
          catch (err) { toast('error', err.message); }
        };
        return html`
          <${Modal} title="Add day" onClose=${onClose}>
            <form class="space-y-3" onSubmit=${submit}>
              <${Field} label="Date" type="date" value=${form.date} onInput=${(e) => setForm((f) => ({ ...f, date: e.target.value }))} required />
              <${Field} label="Notes (optional)" value=${form.notes} onInput=${(e) => setForm((f) => ({ ...f, notes: e.target.value }))} />
              <div class="flex gap-2 pt-1"><${Button} type="submit">Add day<//><${Button} type="button" variant="ghost" onClick=${onClose}>Cancel<//></div>
            </form>
          <//>`;
      }

      // Handles both adding a new activity (POST) and editing an existing one (PATCH).
      // Pass an `activity` to edit; omit it to add.
      function ActivityModal({ tripId, dayId, activity, onClose, onDone, toast }) {
        const isEdit = !!activity;
        const [form, setForm] = useState(
          isEdit
            ? {
                title: activity.title || '',
                startTime: (activity.startTime || '09:00:00').slice(0, 5),
                location: activity.location || '',
                notes: activity.notes || '',
                cost: activity.cost == null ? '' : String(activity.cost),
                category: activity.category || 'SIGHTSEEING',
                bookingLink: activity.bookingLink || '',
              }
            : { title: '', startTime: '09:00', location: '', notes: '', cost: '', category: 'SIGHTSEEING', bookingLink: '' }
        );
        const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
        const submit = async (e) => {
          e.preventDefault();
          const body = {
            title: form.title,
            startTime: form.startTime.length === 5 ? form.startTime + ':00' : form.startTime,
            location: form.location,
            notes: form.notes,
            cost: form.cost === '' ? null : Number(form.cost),
            category: form.category,
            bookingLink: form.bookingLink || null,
          };
          try {
            if (isEdit) {
              await api(`/trips/${tripId}/itinerary/days/${dayId}/activities/${activity.id}`, { method: 'PATCH', body });
              toast('ok', 'Activity updated');
            } else {
              await api(`/trips/${tripId}/itinerary/days/${dayId}/activities`, { method: 'POST', body });
              toast('ok', 'Activity added');
            }
            onDone();
          } catch (err) { toast('error', err.message); }
        };
        return html`
          <${Modal} title=${isEdit ? 'Edit activity' : 'Add activity'} onClose=${onClose}>
            <form class="space-y-3" onSubmit=${submit}>
              <${Field} label="Title" value=${form.title} onInput=${set('title')} required />
              <div class="grid grid-cols-2 gap-3">
                <${Field} label="Start time" type="time" value=${form.startTime} onInput=${set('startTime')} required />
                <label class="block">
                  <span class="mb-1 block text-xs font-medium text-slate-500">Category</span>
                  <select class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-400" value=${form.category} onChange=${set('category')}>
                    ${CATEGORIES.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}
                  </select>
                </label>
              </div>
              <${Field} label="Location" value=${form.location} onInput=${set('location')} required />
              <${Field} label="Notes" value=${form.notes} onInput=${set('notes')} required />
              <div class="grid grid-cols-2 gap-3">
                <${Field} label="Cost (optional)" type="number" step="0.01" value=${form.cost} onInput=${set('cost')} />
                <${Field} label="Booking link (optional)" value=${form.bookingLink} onInput=${set('bookingLink')} />
              </div>
              <div class="flex gap-2 pt-1"><${Button} type="submit">${isEdit ? 'Save changes' : 'Add activity'}<//><${Button} type="button" variant="ghost" onClick=${onClose}>Cancel<//></div>
            </form>
          <//>`;
      }

      function NewTripModal({ onClose, onDone, toast }) {
        const [form, setForm] = useState({ title: '', description: '', destination: '', startDate: '', endDate: '' });
        const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
        const submit = async (e) => {
          e.preventDefault();
          try {
            const trip = await api('/trips', {
              method: 'POST',
              body: { ...form, startDate: form.startDate || null, endDate: form.endDate || null, description: form.description || null, destination: form.destination || null },
            });
            toast('ok', 'Trip created');
            onDone(trip);
          } catch (err) { toast('error', err.message); }
        };
        return html`
          <${Modal} title="New trip" onClose=${onClose}>
            <form class="space-y-3" onSubmit=${submit}>
              <${Field} label="Title" value=${form.title} onInput=${set('title')} required maxLength=${255} placeholder="Japan 2025" />
              <${Field} label="Destination" value=${form.destination} onInput=${set('destination')} placeholder="Tokyo, Japan" />
              <${Field} label="Description" value=${form.description} onInput=${set('description')} />
              <div class="grid grid-cols-2 gap-3">
                <${Field} label="Start date" type="date" value=${form.startDate} onInput=${set('startDate')} />
                <${Field} label="End date" type="date" value=${form.endDate} onInput=${set('endDate')} />
              </div>
              <div class="flex gap-2 pt-1"><${Button} type="submit">Create trip<//><${Button} type="button" variant="ghost" onClick=${onClose}>Cancel<//></div>
            </form>
          <//>`;
      }

      /* ------------------------------- App --------------------------------- */
      function App() {
        const [authed, setAuthed] = useState(!!tokens.access);
        const [user, setUser] = useState(null);
        const [trips, setTrips] = useState([]);
        const [loadingTrips, setLoadingTrips] = useState(false);
        const [selectedId, setSelectedId] = useState(null);
        const [showNew, setShowNew] = useState(false);
        const [toast, setToast] = useState(null);

        const notify = (type, message) => {
          setToast({ type, message });
          setTimeout(() => setToast(null), 4000);
        };

        const loadTrips = useCallback(async () => {
          setLoadingTrips(true);
          try { setTrips(await api('/trips')); }
          catch (err) { notify('error', err.message); }
          finally { setLoadingTrips(false); }
        }, []);

        const loadUser = useCallback(async () => {
          try { setUser(await api('/users/me')); } catch { /* ignore */ }
        }, []);

        useEffect(() => {
          const onLogout = () => { setAuthed(false); setUser(null); setTrips([]); setSelectedId(null); };
          window.addEventListener('hp-logout', onLogout);
          return () => window.removeEventListener('hp-logout', onLogout);
        }, []);

        useEffect(() => {
          if (authed) { loadUser(); loadTrips(); }
        }, [authed]);

        const logout = async () => {
          try { if (tokens.refresh) await api('/auth/logout', { method: 'POST', body: { refreshToken: tokens.refresh } }); } catch { /* ignore */ }
          tokens.clear();
          setAuthed(false); setUser(null); setTrips([]); setSelectedId(null);
        };

        if (!authed) {
          return html`<${React.Fragment}>
            <${AuthScreen} onAuthed=${() => setAuthed(true)} toast=${notify} />
            <${Toast} toast=${toast} onClose=${() => setToast(null)} />
          <//>`;
        }

        return html`
          <div class="flex h-screen flex-col">
            <header class="flex items-center justify-between border-b border-slate-200 bg-white px-5 py-2.5">
              <div class="flex items-center gap-2 font-semibold"><span class="text-lg">🏔️</span> HighPeak <span class="rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-medium uppercase text-slate-400">demo</span></div>
              <div class="flex items-center gap-3 text-sm">
                ${user && html`<span class="text-slate-500">${user.name}</span>`}
                <${Button} variant="ghost" onClick=${logout}>Log out<//>
              </div>
            </header>
            <div class="flex flex-1 overflow-hidden">
              <${Sidebar}
                trips=${trips}
                loading=${loadingTrips}
                selectedId=${selectedId}
                onSelect=${setSelectedId}
                onNew=${() => setShowNew(true)}
                onReload=${loadTrips}
              />
              <main class="flex-1 overflow-hidden bg-slate-50">
                ${selectedId
                  ? html`<${TripDetail}
                      key=${selectedId}
                      tripId=${selectedId}
                      onChanged=${loadTrips}
                      onDeleted=${() => { setSelectedId(null); loadTrips(); }}
                      toast=${notify}
                    />`
                  : html`<div class="flex h-full flex-col items-center justify-center text-center text-slate-400">
                      <div class="text-5xl">🧭</div>
                      <p class="mt-3 text-sm">Select a trip on the left, or create a new one.</p>
                    </div>`}
              </main>
            </div>
            ${showNew && html`<${NewTripModal} onClose=${() => setShowNew(false)} onDone=${(trip) => { setShowNew(false); loadTrips(); setSelectedId(trip.id); }} toast=${notify} />`}
            <${Toast} toast=${toast} onClose=${() => setToast(null)} />
          </div>`;
      }

      createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
  </body>
</html>
