spring:
  data:
    redis:
      password: ${REDIS_PASSWORD}

  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Mail is non-critical (invite emails). A live SMTP connect on every
    # health probe returned DOWN and made the /actuator/health endpoint 503,
    # which fails Railway's health check. Keep it out of the aggregate status.
    mail:
      enabled: false

logging:
  level:
    root: WARN
    com.travelit.backend: INFO

server:
  forward-headers-strategy: framework
